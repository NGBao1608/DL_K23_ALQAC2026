# ALQAC 2026 pipeline config
paths:
  corpus: data/raw/corpus_law_pub.json
  public_test: data/raw/ALQAC2026_public_test.json

retrieval:
  top_k: 5            # articles fed to the reasoner
  candidate_k: 30     # candidates before rerank
  embedding_model: AITeamVN/Vietnamese_Embedding
  reranker_model: AITeamVN/Vietnamese_Reranker
  use_hybrid: true    # RRF(BM25, dense) then rerank

agent:
  model_name: Qwen/Qwen2.5-7B-Instruct   # open-weight, <10B (RULE-COMPLIANT)
  max_tokens: 512
  temperature: 0.0
  few_shot_per_class: 1
  self_consistency_k: 1   # set >1 (e.g. 5) to enable majority voting

labels: [A_WIN, PARTIAL_A_WIN, B_WIN, PARTIAL_B_WIN]
